# Netlify يستضيف خدمة الإحصائيات فقط (المجلد stats-api) — الموقع نفسه على GitHub Pages.
# المجلد الأساسي محدد هنا في الملف حتى لا يعتمد على إعدادات واجهة Netlify.
[build]
  base = "stats-api"
  publish = "public"
  command = "echo stats-api"
  # لا يُعاد النشر إلا عند تغيّر ملفات الخدمة أو هذا الملف
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../netlify.toml"
[functions]
  directory = "netlify/functions"
