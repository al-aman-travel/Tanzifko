<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f5132" />
    <title>لوحة التحكم — تنظيفكو المحلية</title>
    <link rel="icon" href="../favicon.ico" sizes="48x48" />
    <link rel="preload" href="../fonts/cairo-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* خط الموقع نفسه (Cairo) مستضاف محلياً */
      @font-face { font-family: "Cairo"; font-weight: 400; font-display: swap; src: url("../fonts/cairo-arabic-400-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Cairo"; font-weight: 600; font-display: swap; src: url("../fonts/cairo-arabic-600-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Cairo"; font-weight: 700; font-display: swap; src: url("../fonts/cairo-arabic-700-normal.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF; }
      @font-face { font-family: "Cairo"; font-weight: 400; font-display: swap; src: url("../fonts/cairo-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Cairo"; font-weight: 600; font-display: swap; src: url("../fonts/cairo-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Cairo"; font-weight: 700; font-display: swap; src: url("../fonts/cairo-latin-700-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }

      /* هوية الموقع: أخضر الحاويات بدل الأزرق الافتراضي، وخط Cairo بأحجام أوضح على الجوال.
         المحدد :root:root يتغلب على متغيرات Sveltia الافتراضية دون !important. */
      :root:root {
        --sui-base-hue: 150;
        --sui-font-family-default: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
        --sui-font-size-default: 16px;
        --sui-font-size-large: 18px;
        --sui-control-medium-border-radius: 10px;
        --sui-textbox-border-radius: 10px;
      }
      /* الثيم الفاتح: خلفيات عاجية دافئة وذهبي الموقع الغامق (تباين نص ≥ 4.5) */
      :root:root[data-theme=light],
      :root:root:not([data-theme]) {
        --sui-background-color-1-hsl: 48 30% 99.5%;
        --sui-background-color-2-hsl: 50 20% 96.5%;
        --sui-background-color-3-hsl: 52 16% 93%;
        --sui-background-color-4-hsl: 52 14% 89%;
        --sui-background-color-5-hsl: 52 12% 81%;
        --sui-border-color-1-hsl: 150 6% 56%;
        --sui-border-color-2-hsl: 150 8% 74%;
        --sui-border-color-3-hsl: 150 10% 84%;
        --sui-foreground-color-1-hsl: 150 18% 10%;
        --sui-foreground-color-2-hsl: 150 12% 16%;
        --sui-primary-accent-color: hsl(152 69% 19%);
        --sui-primary-accent-color-light: hsl(152 60% 25%);
        --sui-primary-accent-color-dark: hsl(152 72% 14%);
        --sui-primary-accent-color-text: hsl(152 69% 22%);
      }
      @media (prefers-color-scheme: dark) {
        :root:root:not([data-theme]) {
          --sui-background-color-1-hsl: 150 14% 8%; --sui-background-color-2-hsl: 150 12% 10%;
          --sui-background-color-3-hsl: 150 10% 13%; --sui-background-color-4-hsl: 150 9% 17%;
          --sui-primary-accent-color: hsl(45 95% 48%); --sui-primary-accent-color-text: hsl(45 95% 55%);
        }
      }
      :root:root[data-theme=dark] {
        --sui-primary-accent-color: hsl(45 95% 48%); --sui-primary-accent-color-text: hsl(45 95% 55%);
      }
      html, body { margin: 0; background: #f7f6f1; }
      /* شاشة تحميل بهوية الموقع حتى تظهر اللوحة */
      #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
              font-family: "Cairo", system-ui, sans-serif; color: #17221c; background: #f7f6f1; }
      #boot img { width: 56px; height: 56px; margin: 0 auto; }
      #boot b { font-size: 20px; } #boot span { color: #0f5132; font-size: 14px; }
      @media (prefers-color-scheme: dark) { html, body, #boot { background: #0f1712; color: #f7f6f1; } #boot span { color: #f2b705; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-live="polite">
      <img src="../icon-192.png" alt="" />
      <b>تنظيفكو المحلية</b>
      <span>جارٍ تحميل لوحة التحكم…</span>
    </div>
    <!-- المسارات نسبية فتعمل في رابط المعاينة (/Tanzifko/admin/) وبعد ربط الدومين (/admin/).
         Sveltia CMS مستضاف محلياً (نفس النطاق، إصدار مثبّت: انظر sveltia/VERSION.txt) فلا حاجة لـ SRI ولا لـ CDN خارجي -->
    <!-- الدخول بكلمة سر: مفتاح GitHub محفوظ مشفّرًا في token.json (AES-GCM + PBKDF2) ويُفك في المتصفح فقط.
         يُجهَّز أو يُغيَّر من setup.html. -->
    <form id="gate" hidden style="position:fixed;inset:0;display:grid;place-content:center;gap:12px;padding:24px;background:#f7f6f1;font-family:Cairo,system-ui,sans-serif;text-align:center;z-index:10">
      <img src="../icon-192.png" alt="" width="64" height="64" style="margin:0 auto" />
      <b style="font-size:20px;color:#17221c">لوحة تحكم تنظيفكو المحلية</b>
      <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر" required
        style="font:inherit;font-size:18px;padding:12px 14px;border:1px solid #d8d6c8;border-radius:10px;min-width:260px;text-align:center" />
      <button type="submit" style="font:inherit;font-size:18px;font-weight:700;padding:12px;border:0;border-radius:10px;background:#03482a;color:#fff">دخول</button>
      <span id="msg" role="alert" style="color:#b42318;min-height:1.5em"></span>
    </form>
    <script>
      // العربية لغة افتراضية للوحة مهما كانت لغة المتصفح (يمكن تغييرها من الإعدادات وتُحفظ)
      try {
        var k = "sveltia-cms.prefs", p = JSON.parse(localStorage.getItem(k) || "{}") || {};
        if (!p.locale) { p.locale = "ar"; localStorage.setItem(k, JSON.stringify(p)); }
      } catch (e) {}

      (function () {
        var USER = "sveltia-cms.user";
        function startCms() {
          var g = document.getElementById("gate"); if (g) g.remove();
          var s = document.createElement("script"); s.src = "sveltia/sveltia-cms.js"; document.body.appendChild(s);
          // إخفاء شاشة التحميل حين تُرسم واجهة اللوحة
          new MutationObserver(function (_, o) {
            if (document.querySelector("body > :not(#boot):not(script)")) { var b = document.getElementById("boot"); if (b) b.remove(); o.disconnect(); }
          }).observe(document.body, { childList: true });
        }
        var stored = null;
        try { stored = JSON.parse(localStorage.getItem(USER) || "null"); } catch (e) {}
        if (stored && stored.token) { startCms(); return; }

        var boot = document.getElementById("boot"); if (boot) boot.remove();
        var gate = document.getElementById("gate"), msg = document.getElementById("msg");
        gate.hidden = false; gate.style.display = "grid";
        var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
        gate.addEventListener("submit", async function (ev) {
          ev.preventDefault(); msg.textContent = "جارٍ التحقق…";
          try {
            var res = await fetch("token.json", { cache: "no-store" });
            if (!res.ok) { msg.innerHTML = 'لم يُجهَّز الدخول بعد. <a href="setup.html">التجهيز</a>'; return; }
            var box = await res.json();
            var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
            var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.salt), iterations: box.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
            var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data));
            var token = new TextDecoder().decode(plain);
            localStorage.setItem(USER, JSON.stringify({ backendName: "github", token: token }));
            startCms();
          } catch (e) { msg.textContent = "كلمة السر غير صحيحة"; }
        });
      })();
    </script>
  </body>
</html>
