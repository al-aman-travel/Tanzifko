name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # السجل الكامل: تاريخ آخر تعديل لكل صفحة في خريطة الموقع يُقرأ من git
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Astro يتطلب Node 22.23.4 أو أحدث، ونسخة المشغّل المخزّنة قد تكون أقدم
          check-latest: true
          cache: npm
      - name: Install
        run: npm ci
      - name: ذاكرة الصور المحسّنة
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.sha }}
          restore-keys: astro-assets-
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { echo "::error title=Build failed::$(tail -c 2500 build.log | tr '\n' ' ')"; exit 1; }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # إبلاغ Bing وYandex (ومنها بحث ChatGPT وCopilot) بالصفحات فور كل نشر عبر IndexNow
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow
        run: |
          sleep 30
          URLS=$(curl -fsSL https://hawiyatkw.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | python3 -c "import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          [ "$URLS" = "[]" ] && exit 0
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"hawiyatkw.com\",\"key\":\"2f1b317a52a91145805fdb87f78eaecd\",\"keyLocation\":\"https://hawiyatkw.com/2f1b317a52a91145805fdb87f78eaecd.txt\",\"urlList\":$URLS}" -w '\nHTTP %{http_code}\n'
