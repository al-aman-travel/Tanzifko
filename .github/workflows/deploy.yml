name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  # بناء يومي 6:05 صباحًا بتوقيت الكويت لنشر مقالات الدليل المجدولة في يومها
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # السجل الكامل: تاريخ آخر تعديل لكل صفحة في خريطة الموقع يُقرأ من git
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Astro يتطلب Node 22.23.4 أو أحدث، ونسخة المشغّل المخزّنة قد تكون أقدم
          check-latest: true
          cache: npm
      - name: Install
        run: npm ci
      - name: ذاكرة الصور المحسّنة
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ github.sha }}
          restore-keys: astro-assets-
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { echo "::error title=Build failed::$(tail -c 2500 build.log | tr '\n' ' ')"; exit 1; }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # إبلاغ Bing وYandex (ومنها بحث ChatGPT وCopilot) بالصفحات فور كل نشر عبر IndexNow
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: IndexNow
        run: |
          sleep 30
          # البناء اليومي المجدول: نُبلغ فقط بالصفحات التي تغيّرت اليوم (المقال المنشور اليوم ودليله)
          SINCE=$([ "${{ github.event_name }}" = "schedule" ] && TZ=Asia/Kuwait date +%F || echo 0000)
          URLS=$(curl -fsSL https://hawiyatkw.com/sitemap.xml | python3 -c "
          import sys,json,re
          x=sys.stdin.read(); s=sys.argv[1]
          out=[l for l,m in re.findall(r'<loc>([^<]+)</loc>\s*(?:<lastmod>([^<]+)</lastmod>)?',x) if (m or '')[:10]>=s]
          print(json.dumps(out))" "$SINCE")
          [ "$URLS" = "[]" ] && exit 0
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"hawiyatkw.com\",\"key\":\"2f1b317a52a91145805fdb87f78eaecd\",\"keyLocation\":\"https://hawiyatkw.com/2f1b317a52a91145805fdb87f78eaecd.txt\",\"urlList\":$URLS}" -w '\nHTTP %{http_code}\n'

  # GitHub يوقف الجدولة بعد 60 يومًا بلا نشاط في المستودع؛ هذا يعيد تفعيلها مع كل بناء مجدول
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: إبقاء الجدولة فعّالة
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/deploy.yml/enable
